<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LagomChat</title>
<style>
  /* the window split into several chats (the owner, #3776): every pane a chat's own page in a frame, the layout in the address.
     The panes never move in the page (a frame moved is a frame loaded again): each is placed where the layout puts it */
  :root { --bg: #14161b; --panel: #1c1f26; --line: #2c313a; --text: #e6e6e6; --muted: #8b919c; --accent: #e0a458; }
  :root.light { --bg: #f4f2ee; --panel: #fbfaf7; --line: #dcd8d0; --text: #1d1d1f; --muted: #6b6f78; --accent: #a9692b; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.3 "Fira Sans", system-ui, sans-serif; overflow: hidden; }
  #panes { position: fixed; inset: 0; }
  .pane { position: absolute; display: flex; flex-direction: column; box-sizing: border-box; border: 1px solid var(--line); }
  .pane.act { border-color: var(--accent); }
  .pane header { flex: none; display: flex; align-items: center; gap: 2px; height: 26px; padding: 0 4px 0 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .pane header b { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .pane.act header b { color: var(--text); }
  .pane header button { width: 24px; height: 22px; padding: 0; display: grid; place-items: center; border: 0; border-radius: 5px; background: none; color: var(--muted); cursor: pointer; }
  .pane header button:hover { color: var(--accent); background: var(--bg); }
  .pane iframe { flex: 1; min-height: 0; width: 100%; border: 0; background: var(--bg); }
  .bar { position: absolute; z-index: 2; }
  .bar.v { width: 8px; margin-left: -4px; cursor: col-resize; }
  .bar.h { height: 8px; margin-top: -4px; cursor: row-resize; }
  .bar:hover, .bar.on { background: color-mix(in srgb, var(--accent) 45%, transparent); }
  body.drag iframe { pointer-events: none; }        /* a divider dragged over a frame: the frame does not take the pointer away */
</style>
</head>
<body>
<div id="panes"></div>
<script>
'use strict';
// the layout: a pane {u: its chat's address} or a split {d: 'v' (side by side) | 'h' (one above the other), f: the first's share,
// a, b}. It is the address' hash, so a reload or a bookmark brings the same back
const $ = s => document.querySelector(s), box = $('#panes');
try { const t = localStorage.getItem('ac_thm') || localStorage.getItem('ac_theme'); if (['light', 'sepia', 'sky', 'mint', 'rose'].includes(t) || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.classList.add('light'); } catch { /* */ }
const IC = {
  v: '<path d="M4 5h16v14H4zM12 5v14"/>', h: '<path d="M4 5h16v14H4zM4 12h16"/>',
  one: '<path d="M14 4h6v6M20 4l-8 8M10 5H5v14h14v-5"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
};
const ico = k => `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent), KEY = MAC ? 'Cmd+' : 'Ctrl+Alt+';
const L = { v: `Split side by side (${KEY}D)`, h: `Split one above the other (${KEY}Shift+D)`, one: 'Only this chat', x: 'Close' };
let tree = null, seq = 0, act = null;
const panes = new Map();                            // pane id -> { el, fr: its frame, u: the address shown now, t: its title }
// what a pane's chat may use, for its own site only: a frame's allow names the site it was opened on, so a pane gone over to a chat
// of another site lost the screen, the microphone and the camera there (the owner, #3787) - it is opened again with that site's
const FEAT = ['microphone', 'camera', 'display-capture', 'autoplay', 'clipboard-read', 'clipboard-write', 'fullscreen', 'screen-wake-lock'];
const allowFor = o => FEAT.map(f => `${f} ${o}`).join('; ');
// only a chat of this site goes into a pane - this chat's host or another under the same domain (lab.lagom.game: any
// *.lagom.game): a link to /split with another site in it would frame that site under the chat's address, with the camera and
// the microphone the person gave the chat (audit)
const SITE = (h => { const n = h.split('.'); return n.length > 2 && !/^[\d.]+$/.test(h) && !h.includes(':') ? n.slice(1).join('.') : h; })(location.hostname);
const ok = u => { try { const x = new URL(u, location.href), h = x.hostname;
  return /^https?:$/.test(x.protocol) && (h === location.hostname || h === SITE || h.endsWith('.' + SITE)) ? x.href : null; } catch { return null; } };
const good = n => !!n && typeof n === 'object' && (typeof n.u === 'string' || (n.d && good(n.a) && good(n.b)));   // a whole tree, or none
function read() {
  try { const t = JSON.parse(decodeURIComponent(location.hash.slice(1))); if (good(t)) return t; } catch { /* */ }
  return { u: new URL('./', location.href).href };
}
function save() {
  const out = n => n.p ? { u: panes.get(n.p).u } : { d: n.d, f: Math.round(n.f * 1000) / 1000, a: out(n.a), b: out(n.b) };
  history.replaceState(null, '', '#' + encodeURIComponent(JSON.stringify(out(tree))));
  const ts = [...panes.values()].map(p => p.t).filter(Boolean);
  document.title = ts.length ? ts.join(' | ') : 'LagomChat';
}
function pane(u) {
  const id = ++seq, el = document.createElement('div'), fr = document.createElement('iframe');
  el.className = 'pane'; el.dataset.p = id;
  el.innerHTML = `<header><b></b>${['v', 'h', 'one', 'x'].map(k => `<button type="button" data-a="${k}" title="${L[k]}" aria-label="${L[k]}">${ico(k)}</button>`).join('')}</header>`;
  const src = ok(u) || new URL('./', location.href).href, o = new URL(src).origin;
  fr.allow = allowFor(o); fr.src = src;
  el.append(fr); box.append(el);
  panes.set(id, { el, fr, u: src, t: '', o });
  return { p: id };
}
function grow(n) { return n.u !== undefined ? pane(n.u) : { d: n.d === 'h' ? 'h' : 'v', f: Math.min(.9, Math.max(.1, +n.f || .5)), a: grow(n.a), b: grow(n.b) }; }
// where everything goes: each pane's box in percent of the window, a divider at each split
function place() {
  const used = new Set();
  const go = (n, x, y, w, h) => {
    if (n.p) { Object.assign(panes.get(n.p).el.style, { left: x + '%', top: y + '%', width: w + '%', height: h + '%' }); return; }
    const bar = n._bar || (n._bar = Object.assign(document.createElement('div'), { className: 'bar' }));   // kept: one may be dragged now
    bar.classList.toggle('v', n.d === 'v'); bar.classList.toggle('h', n.d === 'h'); bar._n = n; bar._r = [x, y, w, h]; used.add(bar);
    if (n.d === 'v') { go(n.a, x, y, w * n.f, h); go(n.b, x + w * n.f, y, w * (1 - n.f), h); Object.assign(bar.style, { left: x + w * n.f + '%', top: y + '%', height: h + '%', width: '', marginTop: '' }); }
    else { go(n.a, x, y, w, h * n.f); go(n.b, x, y + h * n.f, w, h * (1 - n.f)); Object.assign(bar.style, { top: y + h * n.f + '%', left: x + '%', width: w + '%', height: '', marginLeft: '' }); }
    if (!bar.isConnected) box.append(bar);
  };
  go(tree, 0, 0, 100, 100);
  box.querySelectorAll('.bar').forEach(b => { if (!used.has(b)) b.remove(); });
  panes.forEach((p, id) => p.el.classList.toggle('act', id === act && panes.size > 1));
}
// the node of a pane and its parent split
function find(id, n = tree, up = null) { if (n.p === id) return { n, up }; if (n.p) return null; return find(id, n.a, n) || find(id, n.b, n); }
function split(id, d) {
  const at = find(id); if (!at) return;
  const p = panes.get(id), nn = pane(p.u), old = { p: at.n.p };
  for (const k of Object.keys(at.n)) delete at.n[k];
  Object.assign(at.n, { d, f: .5, a: old, b: nn });
  act = nn.p; place(); save();
}
function close(id) {
  const at = find(id); if (!at) return;
  const p = panes.get(id);
  if (!at.up) { location.href = p.u; return; }
  const other = at.up.a === at.n ? at.up.b : at.up.a;
  for (const k of Object.keys(at.up)) delete at.up[k];
  Object.assign(at.up, other);
  p.el.remove(); panes.delete(id);
  if (panes.size === 1) { location.href = [...panes.values()][0].u; return; }   // one left: that chat alone, as it was
  if (act === id) act = [...panes.keys()][0];
  place(); save();
}
const byWin = w => [...panes.entries()].find(([, p]) => p.fr.contentWindow === w);
// what a pane's chat tells: where it is now (another chat picked in it), its title; a split asked for by its keys
addEventListener('message', e => {
  const hit = byWin(e.source), d = e.data; if (!hit || !d || typeof d !== 'object') return;
  const [id, p] = hit;
  if (d.lc === 'here') { const u = ok(d.u); if (u) p.u = u;
    if (u && new URL(u).origin !== p.o) { p.o = new URL(u).origin; p.fr.allow = allowFor(p.o); p.fr.src = u; } p.t = String(d.t || '').slice(0, 120); p.el.querySelector('header b').textContent = p.t; save(); }
  else if (d.lc === 'split') split(id, d.d === 'h' ? 'h' : 'v');
  else if (d.lc === 'focus') { act = id; place(); }
});
// the pane in use: the one whose frame took the focus last
addEventListener('blur', () => setTimeout(() => { const a = document.activeElement, hit = a && a.tagName === 'IFRAME' && byWin(a.contentWindow); if (hit) { act = hit[0]; place(); } }));
box.addEventListener('click', e => {
  const b = e.target.closest('header button'), id = b && +b.closest('.pane').dataset.p; if (!b) return;
  const a = b.dataset.a;
  if (a === 'v' || a === 'h') split(id, a); else if (a === 'x') close(id); else if (a === 'one') location.href = panes.get(id).u;
});
// the keys here too (a header has the focus): the pane in use is split
addEventListener('keydown', e => {
  if (e.code !== 'KeyD' || e.repeat || !(MAC ? e.metaKey && !e.ctrlKey : e.ctrlKey && e.altKey)) return;
  e.preventDefault(); if (act) split(act, e.shiftKey ? 'h' : 'v');
});
// a divider dragged: the share of the first side follows the pointer
box.addEventListener('pointerdown', e => {
  const bar = e.target.closest('.bar'); if (!bar) return;
  e.preventDefault(); bar.setPointerCapture(e.pointerId); bar.classList.add('on'); document.body.classList.add('drag');
  const n = bar._n, [x, y, w, h] = bar._r;
  const mv = ev => { n.f = Math.min(.9, Math.max(.1, n.d === 'v' ? (ev.clientX / innerWidth * 100 - x) / w : (ev.clientY / innerHeight * 100 - y) / h)); place(); };
  const up = () => { bar.removeEventListener('pointermove', mv); bar.removeEventListener('pointerup', up); bar.removeEventListener('pointercancel', up);
    bar.classList.remove('on'); document.body.classList.remove('drag'); save(); place(); };
  bar.addEventListener('pointermove', mv); bar.addEventListener('pointerup', up); bar.addEventListener('pointercancel', up);
});
// the Mac app's Cmd+W (the owner, #3799): the pane in use goes; with one pane there is nothing of ours to close
window.__acClose = () => { if (panes.size < 2 || !panes.has(act)) return false; close(act); return true; };
tree = grow(read()); act = [...panes.keys()].at(-1); place(); save();
</script>
</body>
</html>
