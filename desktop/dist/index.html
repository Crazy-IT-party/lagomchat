<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LagomChat</title>
<style>
  :root { --bg: #f3f0e9; --panel: #fff; --text: #2b2520; --muted: #766c62; --line: #d8d1c5; --accent: #964b2d; --on: #fff; --err: #b3361e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1c20; --panel: #26272c; --text: #eee9e0; --muted: #a29a8f; --line: #3b3c43; --accent: #c98a5e; --on: #1b1c20; --err: #ef8a73; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 15px -apple-system, system-ui, "Segoe UI", sans-serif; }
  form { width: min(420px, 100%); display: grid; gap: 10px; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  label { color: var(--muted); font-size: 13px; }
  input { width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { justify-self: end; padding: 9px 18px; font: inherit; font-weight: 600; color: var(--on); background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  #err { min-height: 18px; margin: 0; color: var(--err); font-size: 13px; }
</style>
</head>
<body>
<form id="f" novalidate>
  <h1>LagomChat</h1>
  <label for="u">Chat address</label>
  <input id="u" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
  <p id="err" role="alert"></p>
  <button type="submit">Open</button>
</form>
<script>
  const KEY = 'chat_url';
  const read = () => { try { return localStorage.getItem(KEY); } catch { return null; } };
  const save = v => { try { localStorage.setItem(KEY, v); } catch { /* the address just is not remembered */ } };
  const parse = raw => {
    const s = raw.trim();
    if (!s) return null;
    try {
      const url = new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(s) ? s : 'https://' + s);
      return /^https?:$/.test(url.protocol) && url.hostname ? url : null;
    } catch { return null; }
  };
  // the working copy's own chat (the app asks its manager, the owner #2060): opened at once when no address is remembered yet
  const here = parse(new URLSearchParams(location.search).get('chat') || '');
  if (here && !read()) { save(here.href); location.replace(here.href); }
  const u = document.getElementById('u'), err = document.getElementById('err');
  u.value = read() || '';
  u.select();
  u.addEventListener('input', () => { err.textContent = ''; });
  document.getElementById('f').addEventListener('submit', e => {
    e.preventDefault();
    const url = parse(u.value);
    if (!url) { err.textContent = 'Enter an http or https address.'; return; }
    save(url.href);
    location.href = url.href;
  });
</script>
</body>
</html>
