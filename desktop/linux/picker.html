<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="color-scheme" content="light dark">
<title>Share a screen or a window</title>
<style>
  :root { --bg: #f3f0e9; --panel: #fff; --text: #2b2520; --muted: #766c62; --line: #d8d1c5; --accent: #964b2d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1c20; --panel: #26272c; --text: #eee9e0; --muted: #a29a8f; --line: #3b3c43; --accent: #c98a5e; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; }
  h1 { margin: 0 0 12px; font-size: 17px; }
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  button.src { display: grid; gap: 6px; padding: 8px; font: inherit; color: inherit; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  button.src:hover, button.src:focus-visible { border-color: var(--accent); outline: none; }
  button.src img, button.src i { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: contain; background: #000; border-radius: 4px; }
  button.src span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #foot { display: flex; justify-content: flex-end; margin-top: 14px; }
  #cancel { padding: 8px 16px; font: inherit; color: var(--text); background: none; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<h1>What to show to everybody in the chat?</h1>
<div id="list"></div>
<div id="foot"><button type="button" id="cancel">Cancel</button></div>
<script>
  const list = document.getElementById('list');
  picker.onSources(sources => {
    for (const s of sources) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'src';
      const pic = s.img ? Object.assign(document.createElement('img'), { src: s.img, alt: '' }) : document.createElement('i');
      const name = document.createElement('span'); name.textContent = s.name; name.title = s.name;   // a window's title is somebody's text: as text
      b.append(pic, name); b.onclick = () => picker.pick(s.id); list.append(b);
    }
    const first = list.querySelector('button'); if (first) first.focus();
  });
  document.getElementById('cancel').onclick = () => picker.pick(null);
  addEventListener('keydown', e => { if (e.key === 'Escape') picker.pick(null); });
</script>
</body>
</html>
